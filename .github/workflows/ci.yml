name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests (offline, mock adapter only)
        run: python -m pytest -q

      - name: Smoke-test the CLI against fixtures
        run: |
          python -m skillbench run examples/suite_v1.yaml -o /tmp/baseline.json
          python -m skillbench run examples/suite_v2.yaml -o /tmp/current.json || true
          python -m skillbench compare /tmp/baseline.json /tmp/current.json || true
