name: summarizer-suite
version: "1"
prompt: skills/summarize_v1.md
model:
  adapter: mock
  mock:
    mode: template
    template: "Summary: {prompt}"
cases:
  - name: short paragraph
    input:
      text: "SkillBench runs prompt regression tests locally."
    assertions:
      - type: contains
        value: "Summary:"
      - type: contains
        value: "SkillBench"
      - type: max_completion_tokens
        value: 200
  - name: unicode input
    input:
      text: "Résumé du texte en français."
    assertions:
      - type: starts_with
        value: "Summary:"
      - type: not_contains
        value: "Error"
  - name: empty-ish input
    input:
      text: "..."
    assertions:
      - type: regex
        value: "^Summary: .+"
