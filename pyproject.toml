[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbench"
version = "0.1.0"
description = "Regression testing CLI for prompts and agent skills"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[project.scripts]
skillbench = "skillbench.cli:main"

[tool.setuptools.packages.find]
include = ["skillbench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
